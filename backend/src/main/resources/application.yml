# Configurações que podem ir para o GitHub (sem senhas).
# Dados do banco (url, usuário e senha) ficam em application.properties, que NÃO vai para o GitHub.
# Veja application.properties.example e o README.
spring:
  application:
    name: agua-em-dia-api
  jpa:
    open-in-view: false
    hibernate:
      # O banco é criado e atualizado pelo Flyway (db/migration). O Hibernate não mexe nas tabelas.
      ddl-auto: none
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    # Banco que já existia antes do Flyway: considera o que já está lá como ponto de partida e aplica só o que falta
    baseline-on-migrate: true
    baseline-version: 0
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  # true = modo demonstração: liga as simulações do protótipo (veja o README). Em produção, deixe false.
  demo: ${APP_DEMO:false}
  jwt:
    # Segredo que assina os tokens. Obrigatório, com 32 caracteres ou mais.
    segredo: ${JWT_SECRET:}
    horas: 12
  uploads:
    dir: ${UPLOADS_DIR:uploads}
  servico:
    # Chave para sistemas autorizados (ex.: empresa de água) atualizarem a situação de um vazamento
    chave: ${SERVICE_KEY:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    maps-key: ${GOOGLE_MAPS_API_KEY:}
  gemini:
    chave: ${GEMINI_API_KEY:}
    modelo: ${GEMINI_MODEL:gemini-3.5-flash}
  mail:
    remetente: ${MAIL_FROM:}
