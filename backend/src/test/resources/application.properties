# Configuração SOMENTE dos testes. Usa um banco separado (aguaEmDia_teste) para nunca mexer nos seus dados reais.
# O banco é criado sozinho. Informe o usuário/senha do MySQL por variável de ambiente:
#   Windows (PowerShell):  $env:TEST_DB_PASSWORD="sua_senha"
#   Linux/Mac:             export TEST_DB_PASSWORD="sua_senha"
spring.datasource.url=jdbc:mysql://${TEST_DB_HOST:localhost}:${TEST_DB_PORT:3306}/aguaEmDia_teste?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${TEST_DB_PASSWORD:}

app.jwt.segredo=segredo-usado-somente-nos-testes-0123456789
app.demo=true
app.uploads.dir=target/uploads-teste
app.servico.chave=chave-de-servico-dos-testes
